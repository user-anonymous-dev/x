<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gianni | Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.cdnfonts.com/css/gg-sans');

        :root {
            --bg-deep: #0e0e10;
            --bg-sidebar: #1e1f22;
            --bg-main: #2b2d31;
            --accent: #5865f2;
            --accent-glow: rgba(88, 101, 242, 0.3);
            --text-primary: #f2f3f5;
            --text-muted: #949ba4;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* --- NAVIGATION MOBILE --- */
        .mobile-nav {
            display: none; height: 50px; background: var(--bg-sidebar);
            align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border);
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        /* --- LAYOUT --- */
        .app-container { display: flex; width: 100%; height: 100%; }

        /* --- DOCK (SERVEURS) --- */
        .dock { 
            width: 72px; background: var(--bg-deep); display: flex; flex-direction: column; 
            align-items: center; padding: 12px 0; gap: 12px; flex-shrink: 0; z-index: 1001;
        }
        .srv-icon {
            width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.25s cubic-bezier(0.3, 0.1, 0.3, 1); color: var(--text-muted); font-size: 20px;
            position: relative;
        }
        .srv-icon:hover, .srv-icon.active { border-radius: 14px; background: var(--accent); color: white; }
        .srv-icon.active::before {
            content: ''; position: absolute; left: -12px; width: 4px; height: 36px; 
            background: white; border-radius: 0 4px 4px 0;
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; 
            flex-shrink: 0; transition: transform 0.3s ease;
        }
        .sidebar-header { 
            height: 50px; padding: 0 16px; display: flex; align-items: center; font-weight: 800;
            border-bottom: 1px solid var(--border); font-size: 14px; letter-spacing: 0.5px;
        }
        .nav-scroll { flex: 1; padding: 12px 8px; overflow-y: auto; }
        .nav-cat { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 15px 8px 5px; }
        .nav-item {
            padding: 8px 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; 
            gap: 10px; color: var(--text-muted); font-size: 15px; margin-bottom: 2px; transition: 0.2s;
        }
        .nav-item:hover { background: var(--glass); color: white; }
        .nav-item.active { background: rgba(88, 101, 242, 0.15); color: #fff; }

        /* --- MAIN --- */
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); min-width: 0; }
        .top-bar { 
            height: 50px; padding: 0 20px; display: flex; align-items: center; 
            background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border);
        }
        .view-area { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; }

        /* --- CARDS & UI --- */
        .card { 
            background: var(--glass); border: 1px solid var(--border); border-radius: 12px; 
            padding: 24px; margin-bottom: 20px; backdrop-filter: blur(10px);
            animation: slideUp 0.4s ease-out;
        }
        .card h2 { font-size: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .card p { color: var(--text-muted); line-height: 1.6; }
        .btn {
            display: inline-flex; align-items: center; padding: 10px 20px; background: var(--accent);
            color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px;
            margin-top: 15px; transition: 0.3s;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 15px var(--accent-glow); }

        /* --- MOBILE DRAWER --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 999; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .mobile-nav { display: flex; }
            .dock { position: fixed; left: -72px; height: 100%; transition: left 0.3s; }
            .sidebar { position: fixed; left: -312px; height: 100%; z-index: 1001; width: 240px; }
            .app-container.open .dock { left: 0; }
            .app-container.open .sidebar { left: 72px; }
            .app-container.open .overlay { display: block; }
            .main-content { padding-top: 50px; }
            .view-area { padding: 20px; }
            .card { padding: 16px; }
        }

        /* Animations & Secret */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        body.corrupted { animation: glit 0.15s infinite; filter: hue-rotate(90deg) invert(1); }
        @keyframes glit { 0% { transform: translate(0); } 50% { transform: translate(-2px, 2px); } 100% { transform: translate(0); } }
    </style>
</head>
<body>

    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="mobile-nav">
        <i class="fa-solid fa-bars" onclick="toggleMenu()" style="font-size: 20px; cursor: pointer;"></i>
        <span id="mobile-title" style="margin-left: 15px; font-weight: 800; font-size: 14px;">GIANNI_OS</span>
    </div>

    <div class="app-container" id="app">
        <div class="dock">
            <div class="srv-icon active" onclick="switchSrv('me', this)" data-name="GIANNI_PROFIL"><i class="fa-solid fa-ghost"></i></div>
            <div class="srv-icon" onclick="switchSrv('code', this)" data-name="PROJETS_WEB"><i class="fa-solid fa-code"></i></div>
            <div class="srv-icon" onclick="switchSrv('hub', this)" data-name="SERVEURS_COMMU"><i class="fa-brands fa-discord"></i></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header" id="sidebar-name">GIANNI_PROFIL</div>
            <div class="nav-scroll" id="nav-list">
                </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <i class="fa-solid fa-hashtag" style="color:var(--text-muted); margin-right:10px;"></i>
                <span id="view-title" style="font-weight:700;">bienvenue</span>
            </div>
            <div class="view-area" id="view-content">
                </div>
        </div>
    </div>

    <script>
        const DB = {
            me: {
                nav: [
                    { cat: "Général", items: [
                        { id: 'bio', label: 'biographie', icon: 'fa-address-card', content: `
                            <div class="card">
                                <h2><i class="fa-solid fa-user-tie"></i> À propos de moi</h2>
                                <p>Développeur passionné par le design d'interface et l'optimisation système. Je crée des environnements numériques où l'esthétique rencontre la performance.</p>
                            </div>
                            <div class="card">
                                <h2><i class="fa-solid fa-microchip"></i> Setup & Stack</h2>
                                <p>• Frontend: HTML5 / CSS3 / JS (ES6+)<br>• Design: Glassmorphism & UI Minimaliste<br>• Backend: Node.js & Python</p>
                            </div>
                        `},
                        { id: 'stats', label: 'statistiques', icon: 'fa-chart-simple', content: `
                            <div class="card">
                                <h2><i class="fa-solid fa-bolt"></i> Activité</h2>
                                <p>Actuellement sur 3 projets majeurs. Toujours à l'écoute de nouvelles collaborations techniques.</p>
                            </div>
                        `}
                    ]}
                ]
            },
            code: {
                nav: [
                    { cat: "Développement", items: [
                        { id: 'bowling', label: 'bowling-space', icon: 'fa-rocket', content: `
                            <div class="card">
                                <h2>Bowling Spatial</h2>
                                <p>Une expérience interactive développée avec Three.js (Moteur 3D Web). Défiez les lois de la gravité.</p>
                                <a href="#" class="btn">Lancer la démo</a>
                            </div>
                        `}
                    ]}
                ]
            },
            hub: {
                nav: [
                    { cat: "Communautés", items: [
                        { id: 'conc', label: 'concordia', icon: 'fa-shield-heart', content: `
                            <div class="card">
                                <h2>Concordia</h2>
                                <p>Le point de ralliement pour les passionnés. Entraide et partage.</p>
                                <a href="https://discord.gg/FQRn3E8SzN" target="_blank" class="btn">Rejoindre</a>
                            </div>
                        `},
                        { id: 'dev', label: 'dev-community', icon: 'fa-terminal', content: `
                            <div class="card">
                                <h2>The Developer Community</h2>
                                <p>Accès exclusif pour les développeurs. Revues de code et architecture.</p>
                                <a href="https://discord.gg/TrzsT4Z4tr" target="_blank" class="btn" style="background:#23a55a">Accès Membre</a>
                            </div>
                        `},
                        { id: 'serv', label: 'servitium', icon: 'fa-handshake', content: `
                            <div class="card">
                                <h2>Servitium</h2>
                                <p>Le service avant tout. Découvrez nos solutions sur mesure.</p>
                                <a href="https://discord.gg/acz9hU9ufU" target="_blank" class="btn">Voir le serveur</a>
                            </div>
                        `}
                    ]}
                ]
            }
        };

        function switchSrv(key, el) {
            document.querySelectorAll('.srv-icon').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const data = DB[key];
            document.getElementById('sidebar-name').innerText = el.dataset.name;
            const list = document.getElementById('nav-list');
            list.innerHTML = '';

            data.nav.forEach(section => {
                list.innerHTML += `<div class="nav-cat">${section.cat}</div>`;
                section.items.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = `nav-item ${idx === 0 ? 'active' : ''}`;
                    div.innerHTML = `<i class="fa-solid ${item.icon}"></i> ${item.label}`;
                    div.onclick = () => {
                        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                        div.classList.add('active');
                        loadView(item);
                        if(window.innerWidth <= 768) toggleMenu();
                    };
                    list.appendChild(div);
                    if(idx === 0) loadView(item);
                });
            });
        }

        function loadView(item) {
            document.getElementById('view-title').innerText = item.label;
            document.getElementById('view-content').innerHTML = item.content;
        }

        function toggleMenu() {
            document.getElementById('app').classList.toggle('open');
        }

        // --- SECRET EASTER EGG ---
        let k = 0;
        const secret = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        document.addEventListener('keydown', (e) => {
            if(e.key === secret[k]) {
                k++; if(k === secret.length) { document.body.classList.toggle('corrupted'); k = 0; }
            } else k = 0;
        });

        // INIT
        switchSrv('me', document.querySelector('.srv-icon'));
    </script>
</body>
</html>
