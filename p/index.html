<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gianni | Hub Diagnostic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-main: #313338;
            --accent: #5865f2;
            --text-primary: #f2f3f5;
            --text-muted: #949ba4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-deep); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar & Dock */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        .dock { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; }
        .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; }
        
        .srv-icon { 
            width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
            color: var(--text-muted); font-size: 20px;
        }
        .srv-icon.active, .srv-icon:hover { border-radius: 15px; background: var(--accent); color: white; }

        .nav-item { 
            padding: 10px; margin: 2px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); 
            display: flex; align-items: center; gap: 10px;
        }
        .nav-item.active { background: #3f4147; color: white; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .header { height: 48px; border-bottom: 1px solid rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 15px; font-weight: bold; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }

        .card { background: #2b2d31; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 15px; }

        /* Responsive simple */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* On simplifie pour le test */
            .dock { width: 60px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="dock">
            <div class="srv-icon active" onclick="loadContent('me')"><i class="fa-solid fa-user"></i></div>
            <div class="srv-icon" onclick="loadContent('hub')"><i class="fa-solid fa-server"></i></div>
        </div>

        <div class="sidebar">
            <div class="header">GIANNI</div>
            <div id="nav-list" style="padding-top: 10px;">
                </div>
        </div>

        <div class="main">
            <div class="header" id="top-title"># accueil</div>
            <div class="content" id="main-view">
                <div class="card">
                    <h2>Chargement du système...</h2>
                    <p>Si tu vois ce message, c'est que le HTML et le CSS fonctionnent.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DATA = {
            me: {
                title: "PROFIL",
                items: [
                    { label: "ma-bio", content: "<h2>Gianni</h2><p>Développeur passionné.</p>" },
                    { label: "infos", content: "<h2>Statistiques</h2><p>Système opérationnel.</p>" }
                ]
            },
            hub: {
                title: "SERVEURS",
                items: [
                    { label: "concordia", content: "<h2>Concordia</h2><p>Lien: <a href='#' style='color:white'>Clique ici</a></p>" }
                ]
            }
        };

        function loadContent(key) {
            const srv = DATA[key];
            document.getElementById('header-text-temp')?.remove(); // Cleanup
            document.getElementById('top-title').innerText = `# ${srv.title}`;
            
            const nav = document.getElementById('nav-list');
            nav.innerHTML = '';
            
            srv.items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `nav-item ${idx === 0 ? 'active' : ''}`;
                div.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${item.label}`;
                div.onclick = (e) => {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    div.classList.add('active');
                    document.getElementById('main-view').innerHTML = `<div class="card">${item.content}</div>`;
                    e.stopPropagation();
                };
                nav.appendChild(div);
                if(idx === 0) document.getElementById('main-view').innerHTML = `<div class="card">${item.content}</div>`;
            });

            // Update icons style
            document.querySelectorAll('.srv-icon').forEach(icon => icon.classList.remove('active'));
            event?.currentTarget?.classList.add('active');
        }

        // Diagnostic au démarrage
        window.onload = () => {
            console.log("Système prêt.");
            loadContent('me');
        };
    </script>
</body>
</html>
